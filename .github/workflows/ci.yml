name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  corpus:
    name: Anonymized corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Safety net in case the `anonymize` filter was not enabled locally: no
      # Z Xplore user ID (other than Z99999) anywhere in the repository,
      # content or file names. Also covers test snapshots and documentation,
      # which the filter does not process.
      - name: No real user ID
        run: |
          pattern='(?<![A-Za-z0-9])Z(?!99999)[0-9]{5}(?![0-9])'
          status=0
          if git ls-files | grep -P "$pattern"; then
            echo "::error::Real user ID in a file name"; status=1
          fi
          if git grep -nP "$pattern"; then
            echo "::error::Real user ID in the repository: enable the anonymize filter (see README)"; status=1
          fi
          exit $status

  extension:
    name: Extension lint and types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  check:
    name: Clippy and tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      # The crates stay publishable on crates.io (metadata, packaged files).
      - name: Package crates
        if: runner.os == 'Linux'
        run: cargo publish --workspace --dry-run --locked
