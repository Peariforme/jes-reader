name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  corpus:
    name: Corpus anonymisé
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Filet de sécurité si le filtre `anonymize` n'était pas activé
      # localement : aucun userid Z Xplore (hors Z99999) dans le dépôt,
      # contenu ou noms de fichiers. Couvre aussi les snapshots de tests et
      # la documentation, que le filtre ne traite pas.
      - name: Aucun userid réel
        run: |
          pattern='(?<![A-Za-z0-9])Z(?!99999)[0-9]{5}(?![0-9])'
          status=0
          if git ls-files | grep -P "$pattern"; then
            echo "::error::Userid réel dans un nom de fichier"; status=1
          fi
          if git grep -nP "$pattern"; then
            echo "::error::Userid réel dans le dépôt : activer le filtre anonymize (voir README)"; status=1
          fi
          exit $status

  fmt:
    name: Formatage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  check:
    name: Clippy et tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
