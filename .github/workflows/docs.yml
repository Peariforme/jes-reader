name: Docs

# Builds the documentation site (mdBook) on pull requests, and deploys it to
# GitHub Pages on pushes to main.

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - CONTRIBUTING.md
      - editors/vscode/CHANGELOG.md
      - .github/workflows/docs.yml
  pull_request:
    branches: [main]
    paths:
      - docs/**
      - CONTRIBUTING.md
      - editors/vscode/CHANGELOG.md
      - .github/workflows/docs.yml
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5
      - run: mdbook build docs
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: docs/book

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
