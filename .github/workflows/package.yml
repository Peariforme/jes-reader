name: Package

# VSIX par plateforme et binaires CLI à chaque PR et push sur main
# (artefacts téléchargeables). Sur un tag `v*`, publication : release
# GitHub, puis VS Code Marketplace et Open VSX si leurs jetons existent.

permissions:
  contents: read

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: win32-x64, rust: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: linux-x64, rust: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: linux-arm64, rust: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: darwin-x64, rust: x86_64-apple-darwin, os: macos-latest }
          - { target: darwin-arm64, rust: aarch64-apple-darwin, os: macos-latest }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}
      - name: musl
        if: contains(matrix.rust, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: package-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: package-${{ matrix.rust }}-
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: VSIX
        working-directory: editors/vscode
        run: |
          npm ci
          npm run package -- ${{ matrix.target }}

      - name: CLI
        run: |
          cargo build --release --locked -p jes-reader-cli --target ${{ matrix.rust }}
          version=$(node -p "require('./editors/vscode/package.json').version")
          name=jes-reader-cli-${{ matrix.target }}-$version
          mkdir -p dist
          # Artefact à plat : la publication attend des fichiers, pas des dossiers.
          cp editors/vscode/dist/*.vsix dist/
          cd target/${{ matrix.rust }}/release
          if [[ "${{ matrix.target }}" == win32-* ]]; then
            7z a -tzip "$GITHUB_WORKSPACE/dist/$name.zip" jes-reader.exe
          else
            tar -czf "$GITHUB_WORKSPACE/dist/$name.tar.gz" jes-reader
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: jes-reader-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publication
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag et versions concordent
        run: |
          tag=${GITHUB_REF_NAME#v}
          extension=$(node -p "require('./editors/vscode/package.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "tag $tag, extension $extension, cargo $cargo"
          test "$tag" = "$extension" && test "$tag" = "$cargo"

      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --generate-notes

      - uses: actions/setup-node@v4
        if: env.VSCE_PAT != '' || env.OVSX_PAT != ''
        with:
          node-version: 20
      - name: Outils de publication
        if: env.VSCE_PAT != '' || env.OVSX_PAT != ''
        working-directory: editors/vscode
        run: npm ci

      - name: VS Code Marketplace
        if: env.VSCE_PAT != ''
        working-directory: editors/vscode
        run: npx vsce publish --packagePath ../../release/*.vsix

      - name: Open VSX
        if: env.OVSX_PAT != ''
        working-directory: editors/vscode
        run: npx ovsx publish --packagePath ../../release/*.vsix
