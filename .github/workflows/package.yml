name: Package

# Platform-specific VSIX and CLI binaries on every PR and push to main
# (downloadable artifacts). On a `v*` tag, publishing: GitHub release,
# then VS Code Marketplace (Trusted Publishing, when the PUBLISH_MARKETPLACE
# variable is "true") and Open VSX (when the OVSX_PAT secret exists), and
# the crates on crates.io (Trusted Publishing, when the PUBLISH_CRATES
# variable is "true").

permissions:
  contents: read

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: win32-x64, rust: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: linux-x64, rust: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: linux-arm64, rust: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: darwin-x64, rust: x86_64-apple-darwin, os: macos-latest }
          - { target: darwin-arm64, rust: aarch64-apple-darwin, os: macos-latest }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}
      - name: musl
        if: contains(matrix.rust, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: package-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: package-${{ matrix.rust }}-
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: VSIX
        working-directory: editors/vscode
        run: |
          npm ci
          npm run package -- ${{ matrix.target }}

      - name: CLI
        run: |
          cargo build --release --locked -p jes-reader-cli --target ${{ matrix.rust }}
          version=$(node -p "require('./editors/vscode/package.json').version")
          name=jes-reader-cli-${{ matrix.target }}-$version
          mkdir -p dist
          # Flat artifact: the publish job expects files, not directories.
          cp editors/vscode/dist/*.vsix dist/
          cd target/${{ matrix.rust }}/release
          if [[ "${{ matrix.target }}" == win32-* ]]; then
            7z a -tzip "$GITHUB_WORKSPACE/dist/$name.zip" jes-reader.exe
          else
            tar -czf "$GITHUB_WORKSPACE/dist/$name.tar.gz" jes-reader
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: jes-reader-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance of the release assets (gh attestation verify).
      attestations: write
      # VS Code Marketplace Trusted Publishing: GitHub's OIDC token proves
      # this repository and workflow to the Marketplace, no stored secret.
      id-token: write
    env:
      # Repository variable, set to "true" once the Marketplace publisher
      # has a Trusted Publishing policy for this repository and workflow.
      PUBLISH_MARKETPLACE: ${{ vars.PUBLISH_MARKETPLACE }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches versions
        run: |
          tag=${GITHUB_REF_NAME#v}
          extension=$(node -p "require('./editors/vscode/package.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          core=$(sed -n 's/^jes-reader-core = .*version = "\(.*\)".*/\1/p' Cargo.toml)
          echo "tag $tag, extension $extension, cargo $cargo, core dependency $core"
          test "$tag" = "$extension" && test "$tag" = "$cargo" && test "$tag" = "$core"

      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      # The VSIX from the GitHub release are not signed by a store: their
      # checksums and a GitHub-signed provenance attestation let an offline
      # workstation check them.
      - name: Checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/*

      # Re-runnable: when the release already exists (job re-run after the
      # Marketplace was set up), its assets are replaced instead.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --generate-notes
          fi

      - uses: actions/setup-node@v4
        if: env.PUBLISH_MARKETPLACE == 'true' || env.OVSX_PAT != ''
        with:
          node-version: 22
      - name: Publishing tools
        if: env.PUBLISH_MARKETPLACE == 'true' || env.OVSX_PAT != ''
        working-directory: editors/vscode
        run: npm ci

      - name: VS Code Marketplace
        if: env.PUBLISH_MARKETPLACE == 'true'
        working-directory: editors/vscode
        run: npx vsce publish --oidc --skip-duplicate --packagePath ../../release/*.vsix

      - name: Open VSX
        if: env.OVSX_PAT != ''
        working-directory: editors/vscode
        run: npx ovsx publish --skip-duplicate --packagePath ../../release/*.vsix

  crates:
    name: crates.io
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_CRATES == 'true'
    # After the GitHub release: the tag has been checked against the versions.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # crates.io Trusted Publishing: GitHub's OIDC token is exchanged for a
      # short-lived publish token, no stored secret.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # In dependency order. Re-runnable: a version already on crates.io is
      # skipped.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          for crate in jes-reader-core jes-reader-lsp jes-reader-cli; do
            status=$(curl -s -o /dev/null -w '%{http_code}' \
              -A 'jes-reader release workflow (github.com/Peariforme/jes-reader)' \
              "https://crates.io/api/v1/crates/$crate/$version")
            if [ "$status" = 200 ]; then
              echo "$crate $version is already published"
            else
              cargo publish --locked -p "$crate"
            fi
          done
