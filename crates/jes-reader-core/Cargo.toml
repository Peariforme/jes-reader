[package]
name = "jes-reader-core"
description = "Parsing and analysis of z/OS JES2 sysouts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
categories = ["parser-implementations", "development-tools"]
readme = "README.md"
# Tests read the corpus at the root of the repository: not packaged.
include = ["catalog.toml", "src/**/*.rs", "README.md"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
toml = { version = "1.2.3", default-features = false, features = ["parse", "serde"] }

[lints]
workspace = true

[dev-dependencies]
insta = "1.49.0"
