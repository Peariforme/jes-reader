[package]
name = "jes-reader-lsp"
description = "Language server (LSP) for z/OS JES2 sysouts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
categories = ["development-tools", "text-editors"]
readme = "README.md"
# Tests read the corpus at the root of the repository: not packaged.
include = ["src/**/*.rs", "README.md"]

[dependencies]
anyhow = "1.0.105"
jes-reader-core.workspace = true
lsp-server = "0.10.0"
lsp-types = "0.97.0"
serde_json = "1.0.154"

[lints]
workspace = true

[dev-dependencies]
serde = "1.0.229"
